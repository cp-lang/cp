[package]
name = "cpc"
version = "0.1.0"
edition = "2021"

[dependencies]
logos = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
num-derive = "0.4"
num-traits = "0.2"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
tower-lsp = "0.20"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
pretty_assertions = "1.4"
